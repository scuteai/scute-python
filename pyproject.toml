[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scute"
version = "0.1.0"
description = "Scute for Python: sign-in verification, users and sessions, and authorization for your app's users."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "cryptography>=42"]

[project.urls]
Homepage = "https://github.com/scuteai/scute-python"

[tool.hatch.build.targets.wheel]
packages = ["src/scute"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
strict = true
python_version = "3.10"
